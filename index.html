<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffecd2);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            z-index: 10;
        }

        .couple-photo {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 15px;
            border: 4px solid #ff4d6d;
            margin-bottom: 20px;
        }

        h1 { color: #ff4d6d; margin-bottom: 30px; }

        .btn-group {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yesBtn { background: #ff4d6d; color: white; }

        #noBtn {
            background: #888;
            color: white;
            position: absolute; /* Keeps it movable */
            transition: 0.1s ease;
        }
    </style>
</head>
<body>

    <div id="container">
        <img src="us.jpg" alt="Media Offline - Check filename" class="couple-photo" id="mainImg">
        <h1>Are we a package deal for V-Day? 🎁🔥</h1>
        <div class="btn-group">
            <button id="yesBtn">YES! 💖</button>
            <button id="noBtn">Nahhh 💀</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Logic to keep the button inside the screen
        noBtn.addEventListener('mouseover', () => {
            const padding = 20; // Keeps it away from the very edge
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });

        yesBtn.addEventListener('click', () => {
            document.getElementById('container').innerHTML = `
                <img src="us.jpg" class="couple-photo">
                <h1 style="color: #ff4d6d;">YAYYY! There was no way you could have said no.. obviously! 😉</h1>
                <p>Can't wait for the 14th! ❤️</p>
            `;
            document.body.style.background = "#ff4d6d";
        });
    </script>
</body>
</html>
